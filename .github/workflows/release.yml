
name: Release FFAUX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release
    runs-on: windows-latest

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Read Application Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content "FFAUX.iss" -Raw

          if ($content -match '(?m)^#define MyAppVersion "([^"]+)"') {
              "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          }
          else {
              throw "MyAppVersion not found in FFAUX.iss"
          }

      - name: Build FFAUX with PyInstaller
        run: pyinstaller --clean --noconfirm FFAUX.spec

      - name: Verify Build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FFAUX.exe")) {
              throw "FFAUX.exe was not generated!"
          }

      - name: Compile Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer" | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
              throw "Inno Setup Compiler not found!"
          }

          & $iscc "FFAUX.iss"

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compilation failed!"
          }

      - name: Verify Installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer" -Filter "*.exe"

          if (!$installer) {
              throw "Installer was not generated!"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: FFAUX v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: installer/*.exe
